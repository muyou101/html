<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cesium + Vue</title>
    <!-- 引入 Cesium 样式 -->
    <link rel="stylesheet" href="Cesium/Build/Cesium/Widgets/widgets.css">
    <!-- 引入 Cesium 核心库 -->
    <script src="Cesium/Build/Cesium/Cesium.js"></script>
    <!-- 引入 Vue -->
    <script src="js/vue.js"></script>
    <style>
        html, body, #app, #cesiumContainer {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="cesiumContainer"></div>
    </div>
    <script>
        new Vue({
            el: '#app',
            mounted() {
                const viewer = new Cesium.Viewer('cesiumContainer', {
                    // terrainProvider: Cesium.createWorldTerrain()   // 这一行先注释掉
                });
                console.log('Cesium 地球已加载', viewer);
                this.viewer = viewer;
            }
        });
    </script>
</body>
</html>
